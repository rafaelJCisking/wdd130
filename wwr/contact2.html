<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Rafting Trancura Chile</title>
    <link rel="stylesheet" href="styles/rafting.css">
    <meta name="description" content="Contact Rafting Trancura Chile for booking and inquiries">
    <meta name="author" content="Rafael Valdes">

</head>

<body>
    <header>
        <img src="images/z-splash.png" alt="Rafting Trancura Chile logo">
        <nav aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html" aria-current="page">Contact Us</a>
        </nav>
    </header>

    <main>
        <section class="contact-info">
            <h1>Rafting Trancura Pucon</h1>
            <p>Av. Bernardo Ohiggins, pucon
                +5694435564
                pucontrancura@gmail.com</p>

            <div class="map-container">
                <h2>Find Us</h2>
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d51234.56789012345!2d-71.97890123456789!3d-39.27890123456789!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x9614c8b5a1234567%3A0x1234567890abcdef!2sPuc%C3%B3n%2C%20Araucan%C3%ADa!5e0!3m2!1sen!2scl!4v1234567890123!5m2!1sen!2scl"
                  allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade">
                </iframe>
            </div>

            <section id="booking">
                <h2>Book Your Rafting Experience</h2>
                <form action="/enviar-reserva" method="POST">
                    <label for="fullname">Full Name:</label>
                    <input type="text" id="fullname" name="fullname" required
                      placeholder="John Doe">

                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email" required
                      placeholder="you@example.com">

                    <label for="date">Preferred Date:</label>
                    <input type="date" id="date" name="date" required>

                    <label for="group-size">Number of Participants:</label>
                    <input type="number" id="group-size" name="group_size" min="1" max="20"
                      required>

                    <label for="message">Questions or Special Requests:</label>
                    <textarea id="message" name="message" rows="4"
                      placeholder="Allergies, experience level, etc."></textarea>

                    <button type="submit">Send Booking Request</button>
                </form>
            </section>
        </section>
    </main>

    <footer>
        <p>©2026 🌴 Rafting Trancura Chile 🌴 Pucón, Chile</p>
        <nav class="socialmedia" aria-label="Social media links">
            <a href="https://facebook.com" target="_blank" rel="noopener noreferrer">
                <img src="images/facebook.jpg" alt="Visit us on Facebook">
            </a>
            <a href="https://linkedin.com" target="_blank" rel="noopener noreferrer">
                <img src="images/linkedin.png" alt="Connect with us on LinkedIn">
            </a>
            <a href="https://instagram.com" target="_blank" rel="noopener noreferrer">
                <img src="images/instagram.png" alt="Follow us on Instagram">
            </a>
        </nav>
    </footer>
</body>

</html>
