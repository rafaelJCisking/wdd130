<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Rafting Trancura Chile</title>
    <link rel="stylesheet" href="styles/rafting.css">
    <meta name="description" content="Contact Rafting Trancura Chile for booking and inquiries">
    <meta name="author" content="Rafael Valdes">
</head>

<body>
    <header>
        <div class="header-content">
            <div class="logo-placeholder">
                <img src="images/z-splash.png" alt="Rafting Trancura Chile logo">
            </div>
            <nav aria-label="Main navigation">
                <a href="index.html">Home</a>
                <a href="about.html">About Us</a>
                <a href="trips.html">Trips</a>
                <a href="contact.html" aria-current="page">Contact Us</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="company-info">
            <h1>Rafting Trancura Pucon</h1>
            <address>
                Av. Bernardo O'Higgins, Pucon<br>
                +56 9 4435 564<br>
                pucontrancura@gmail.com
            </address>
        </section>

        <section class="contact-section">
            <div class="map-container">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d51234.56789012345!2d-71.97890123456789!3d-39.27890123456789!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x9614c8b5a1234567%3A0x1234567890abcdef!2sPuc%C3%B3n%2C%20Araucan%C3%ADa!5e0!3m2!1sen!2scl!4v1234567890123!5m2!1sen!2scl"
                  allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade">
                </iframe>
            </div>

            <form class="contact-form" action="/enviar-reserva" method="POST">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Placeholder" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Placeholder" required>
                </div>

                <div class="form-group">
                    <label>Purpose</label>
                    <div class="radio-group">
                        <label class="radio-label">
                            <input type="radio" name="purpose" value="general" checked>
                            General Inquiry
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="purpose" value="reservation">
                            Reservation Question
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="purpose" value="suggestion">
                            Website Suggestion
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="4"
                      placeholder="Type here"></textarea>
                </div>

                <div class="form-group checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" name="newsletter" value="yes">
                        Please Subscribe me to the monthly newsletter
                    </label>
                </div>

                <button type="submit" class="submit-btn">Get in Touch!</button>
            </form>
        </section>

        <section class="team-section">
            <h2>We Are Here to Serve You</h2>
            <div class="team-grid">
                <div class="employee-card">
                    <div class="employee-photo">
                        <img src="images/perfil1.jpg" alt="Employee">
                    </div>
                    <p>Marketing Director</p>
                </div>
                <div class="employee-card">
                    <div class="employee-photo">
                        <img src="images/perfil2.jpg" alt="Employee">
                    </div>
                    <p>Sales Manager</p>
                </div>
                <div class="employee-card">
                    <div class="employee-photo">
                        <img src="images/perfil3.jpg" alt="Employee">
                    </div>
                    <p>Owner</p>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>©2026 🌴 Rafting Trancura Chile 🌴 Pucón, Chile</p>
        <nav class="socialmedia" aria-label="Social media links">
            <a href="https://facebook.com" target="_blank" rel="noopener noreferrer">
                <img src="images/facebook.jpg" alt="Visit us on Facebook">
            </a>
            <a href="https://linkedin.com" target="_blank" rel="noopener noreferrer">
                <img src="images/linkedin.png" alt="Connect with us on LinkedIn">
            </a>
            <a href="https://instagram.com" target="_blank" rel="noopener noreferrer">
                <img src="images/instagram.png" alt="Follow us on Instagram">
            </a>
        </nav>
    </footer>
</body>

</html>
